# Hermes dashboard - nginx server block.
# Installed at /etc/nginx/conf.d/hermes.conf (the stock default.conf is removed).
#
# Two jobs:
#   1. Serve the built SPA with an index.html fallback so client-side routes
#      (/jobs, /runs, ...) survive a hard refresh.
#   2. Reverse-proxy /api -> hermes-core:8080, in a way that does NOT break
#      Server-Sent Events (/api/runs/{id}/events, /api/containers/{id}/logs).

# Docker's embedded DNS. Resolving the upstream at *request* time (via a variable
# in proxy_pass) means nginx starts even if hermes-core is not up yet, and it
# picks up a new container IP after hermes-core is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# Long-lived SSE responses must never be buffered to disk or held by a cache.
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;

server {
  listen      80;
  listen      [::]:80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Hermes is a single-user, self-hosted tool bound to 127.0.0.1 by default,
  # but these cost nothing and stop the dashboard being framed or sniffed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "SAMEORIGIN" always;
  add_header Referrer-Policy        "no-referrer" always;

  # Do not compress proxied event streams; text assets are handled below.
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    off;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

  client_max_body_size 25m;   # /api/resume/upload takes a .pdf/.docx

  # ---------------------------------------------------------------- API proxy
  location /api/ {
    set $hermes_core "hermes-core:8080";

    # Variable upstream => runtime DNS. $request_uri keeps the /api prefix and
    # the query string exactly as the browser sent them.
    proxy_pass http://$hermes_core$request_uri;

    # HTTP/1.1 + an empty Connection header: required for chunked streaming.
    # Deliberately NOT doing WebSocket Upgrade mapping here - hermes-core only
    # streams via SSE, and a "Connection: close" would disable upstream keepalive.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding   "";   # never gzip an event stream

    # Stream immediately, byte for byte.
    proxy_buffering           off;
    proxy_cache               off;
    chunked_transfer_encoding off;

    # SSE connections stay open; 60s (the default) would kill the run log.
    proxy_connect_timeout 15s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
  }

  # ------------------------------------------------------------- static assets
  # Vite emits content-hashed filenames into /assets, so they are immutable.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # index.html itself must never be cached, or a redeploy serves stale asset refs.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # ------------------------------------------------------------- SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
